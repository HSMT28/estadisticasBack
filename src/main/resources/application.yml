spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=ESTADISTICAS;encrypt=true;trustServerCertificate=true;integratedSecurity=true;
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: true